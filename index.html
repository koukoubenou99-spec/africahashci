<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Africa Mining</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
background:#f5f6fa;
}

/* conteneur principal */

.container{

max-width:420px;
margin:auto;
height:100vh;
background:white;

display:flex;
flex-direction:column;
padding:20px;

}

/* header */

.header{

text-align:center;
margin-bottom:20px;

}

.header h1{

margin:0;
color:#222;

}

/* hero image */

.hero img{

width:100%;
border-radius:12px;
margin-bottom:20px;

}

/* inputs */

.input-group{

display:flex;
gap:8px;
margin-bottom:10px;

}

input{

flex:1;
padding:12px;

border-radius:8px;
border:1px solid #ccc;

font-size:14px;

}

/* boutons */

button{

padding:12px 14px;
border:none;

border-radius:8px;
background:#f1c40f;

font-weight:bold;
cursor:pointer;

}

button.secondary{

background:#eee;

}

/* carte */

.card{

background:#f9f9f9;
padding:15px;

border-radius:10px;
margin-top:10px;

}

/* machines */

.machine{

display:flex;
gap:10px;

background:#fafafa;
padding:10px;

border-radius:10px;
margin:10px 0;

align-items:center;

}

.machine img{

width:50px;
height:50px;

}

</style>

</head>

<body>

<div id="app" class="container"></div>

<script>

/* base données local */

let users = JSON.parse(localStorage.getItem("users")) || {}
let current = null

function save(){

localStorage.setItem("users",JSON.stringify(users))

}

/* accueil */

function home(){

app.innerHTML = `

<div class="header">

<h1>Africa Mining</h1>

</div>

<div class="hero">

<img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Bitcoin_mining_hardware.jpg">

</div>

<div class="input-group">

<input id="phone" placeholder="Numéro ivoirien (0700000000)">

<input id="pin" type="password" maxlength="4" placeholder="PIN">

<button onclick="login()">Connexion</button>

</div>

<button class="secondary" onclick="register()">Créer compte</button>

`

}

/* inscription */

function register(){

let phone = document.getElementById("phone").value
let pin = document.getElementById("pin").value

if(phone.length != 10){

alert("Numéro ivoirien invalide")
return

}

if(pin.length != 4){

alert("Le code PIN doit être 4 chiffres")
return

}

if(users[phone]){

alert("Compte déjà existant")
return

}

users[phone] = {

pin:pin,
balance:0,
machines:[]

}

save()

alert("Compte créé avec succès")

}

/* connexion */

function login(){

let phone = document.getElementById("phone").value
let pin = document.getElementById("pin").value

if(!users[phone] || users[phone].pin != pin){

alert("Numéro ou PIN incorrect")
return

}

current = phone

dashboard()

}

/* dashboard */

function dashboard(){

let u = users[current]

app.innerHTML = `

<div class="header">

<h1>Tableau de bord</h1>

</div>

<div class="card">

Compte : ${current}<br><br>

Solde : <b>${u.balance} FCFA</b>

</div>

<button onclick="machines()">Machines de minage</button>

<button onclick="logout()">Déconnexion</button>

`

}

/* machines */

let machines = [

{name:"ASIC BTC S1",price:2500,gain:250,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S2",price:5000,gain:600,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S3",price:10000,gain:1300,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S4",price:20000,gain:2800,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"}

]

function machines(){

let html = "<h2>Machines</h2>"

machines.forEach((m,i)=>{

html += `

<div class="machine">

<img src="${m.img}">

<div>

<b>${m.name}</b><br>

Prix : ${m.price} FCFA<br>

Gain : ${m.gain} FCFA / jour<br>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`

})

html += `<button onclick="dashboard()">Retour</button>`

app.innerHTML = html

}

/* acheter */

function buy(i){

let u = users[current]
let m = machines[i]

if(u.balance < m.price){

alert("Solde insuffisant")
return

}

u.balance -= m.price
u.machines.push(m)

save()

alert("Machine activée")

dashboard()

}

/* logout */

function logout(){

current = null
home()

}

home()

</script>

</body>
</html>
