<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Mining App</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.container{
max-width:600px;
height:90vh;
margin:auto;
margin-top:20px;
background:white;
border-radius:10px;
padding:20px;
display:flex;
flex-direction:column;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
padding:10px;
margin:5px;
border:none;
border-radius:8px;
background:gold;
font-weight:bold;
cursor:pointer;
}

input{
padding:10px;
margin:5px;
border-radius:6px;
border:1px solid #ccc;
width:90%;
}

.machine{
background:#fafafa;
border-radius:10px;
padding:10px;
margin:10px;
display:flex;
align-items:center;
gap:10px;
}

.machine img{
width:60px;
}

#machineList{
overflow-y:auto;
height:350px;
}

</style>

</head>

<body>

<div class="container" id="app"></div>

<script>

let app=document.getElementById("app")

let users={}

let currentUser=null

let pendingDeposits=[]

let machines=[

{price:2500,monthly:7000,img:"https://i.imgur.com/Fh7XVYY.png"},
{price:5000,monthly:14000,img:"https://i.imgur.com/7yUvePI.png"},
{price:10000,monthly:28000,img:"https://i.imgur.com/3ZQ3Z9C.png"},
{price:15000,monthly:42000,img:"https://i.imgur.com/YkR7JQp.png"},
{price:20000,monthly:56000,img:"https://i.imgur.com/8M9Qp9H.png"},
{price:25000,monthly:70000,img:"https://i.imgur.com/gX4C6iP.png"},
{price:30000,monthly:84000,img:"https://i.imgur.com/xVv7g9M.png"},
{price:45000,monthly:126000,img:"https://i.imgur.com/Zw7fZQJ.png"},
{price:75000,monthly:210000,img:"https://i.imgur.com/VmV8cNT.png"},
{price:100000,monthly:280000,img:"https://i.imgur.com/KjzX8JH.png"},
{price:150000,monthly:420000,img:"https://i.imgur.com/2oYFJ7h.png"},
{price:200000,monthly:560000,img:"https://i.imgur.com/OP5nG8v.png"}

]

function home(){

app.innerHTML=`

<h2>Connexion</h2>

<input id="loginUser" placeholder="Nom utilisateur">

<input id="loginPass" placeholder="Mot de passe 6 chiffres" type="password">

<button onclick="login()">Se connecter</button>

<button onclick="registerPage()">Créer un compte</button>

<br><br>

<button onclick="googleLogin()">Connexion Google</button>

`

}

function registerPage(){

app.innerHTML=`

<h2>Inscription</h2>

<input id="regUser" placeholder="Nom utilisateur">

<input id="regMail" placeholder="Email Google">

<input id="regPass" placeholder="Mot de passe 6 chiffres" type="password">

<button onclick="register()">S'inscrire</button>

<button onclick="home()">Retour</button>

`

}

function register(){

let user=document.getElementById("regUser").value
let mail=document.getElementById("regMail").value
let pass=document.getElementById("regPass").value

if(pass.length!=6){

alert("Mot de passe doit être 6 chiffres")
return

}

if(users[user]){

alert("Utilisateur existe déjà")
return

}

users[user]={

email:mail,
pass:pass,
balance:0,
machines:[]

}

alert("Compte créé")

home()

}

function login(){

let user=document.getElementById("loginUser").value
let pass=document.getElementById("loginPass").value

if(!users[user]){

alert("Compte inexistant")
return

}

if(users[user].pass!=pass){

alert("Mot de passe incorrect")
return

}

currentUser=user

dashboard()

}

function googleLogin(){

alert("Connexion Google simulée")

}

function dashboard(){

let u=users[currentUser]

app.innerHTML=`

<h2>Bienvenue ${currentUser}</h2>

<h3>Solde : ${u.balance} FCFA</h3>

<button onclick="machinesPage()">Machines</button>

<button onclick="deposit()">Faire un dépôt</button>

<button onclick="logout()">Déconnexion</button>

<br><br>

<button onclick="adminPanel()">Admin</button>

`

}

function machinesPage(){

let html=`

<h2>Machines</h2>

<div id="machineList">

`

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

Machine ${i+1}<br>

Prix : ${m.price} FCFA<br>

Gain : ${m.monthly} FCFA / mois<br>

<button onclick="buyMachine(${i})">Acheter</button>

</div>

</div>

`

})

html+=`

</div>

<button onclick="dashboard()">Retour</button>

`

app.innerHTML=html

}

function buyMachine(i){

let u=users[currentUser]

let m=machines[i]

if(u.balance<m.price){

alert("Solde insuffisant")

return

}

u.balance-=m.price

u.machines.push(m)

alert("Machine achetée")

dashboard()

}

function deposit(){

let amount=prompt("Montant du dépôt")

if(!amount)return

pendingDeposits.push({

user:currentUser,
amount:parseInt(amount)

})

alert("Dépôt envoyé à l'administration")

}

function adminPanel(){

let html="<h2>Dépôts en attente</h2>"

pendingDeposits.forEach((d,i)=>{

html+=`

<div>

Utilisateur : ${d.user}<br>

Montant : ${d.amount} FCFA

<br><br>

<button onclick="validateDeposit(${i})">Valider</button>

<button onclick="rejectDeposit(${i})">Refuser</button>

</div>

<hr>

`

})

html+=`<button onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

function validateDeposit(i){

let d=pendingDeposits[i]

users[d.user].balance+=d.amount

pendingDeposits.splice(i,1)

alert("Dépôt validé")

adminPanel()

}

function rejectDeposit(i){

pendingDeposits.splice(i,1)

alert("Dépôt refusé")

adminPanel()

}

function logout(){

currentUser=null

home()

}

home()

</script>

</body>

</html>
