<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfricaHash Mining Pro</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

.container{
max-width:700px;
margin:auto;
height:94vh;
padding:20px;
background:white;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
text-align:center;
}

h1{color:#c89b00}

button{
padding:12px 20px;
margin:6px;
border:none;
border-radius:8px;
background:gold;
font-weight:bold;
cursor:pointer;
}

input{
padding:10px;
margin:8px;
border-radius:6px;
border:1px solid #ccc;
width:85%;
}

.machine{
background:#fff9db;
padding:12px;
margin:10px;
border-radius:10px;
display:flex;
align-items:center;
gap:10px;
}

.machine img{
width:65px;
height:65px;
}

#machineList{
overflow-y:auto;
height:360px;
}

.progress{
width:100%;
background:#ddd;
border-radius:6px;
height:8px;
margin-top:6px;
}

.bar{
height:8px;
background:gold;
border-radius:6px;
}

#ticker{
background:#fff3c4;
padding:10px;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
white-space:nowrap;
}

#ticker span{
display:inline-block;
padding-right:50px;
animation:ticker 15s linear infinite;
color:#a88400;
font-weight:bold;
}

@keyframes ticker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

.notice{
background:#e8ffe8;
padding:8px;
border-radius:6px;
margin-bottom:10px;
}

.hero img{
width:100%;
border-radius:10px;
margin-top:15px;
}

</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

let app=document.getElementById("app");

let users=JSON.parse(localStorage.getItem("users"))||{};
let user=localStorage.getItem("user");
let balance=parseFloat(localStorage.getItem("balance"))||0;

let ownedMachines=JSON.parse(localStorage.getItem("machines"))||[];
let history=JSON.parse(localStorage.getItem("history"))||[];

let referral=localStorage.getItem("ref")||"";

let machines=[

{price:2500,monthly:7000,img:"https://cdn-icons-png.flaticon.com/512/1041/1041876.png"},
{price:5000,monthly:14000,img:"https://cdn-icons-png.flaticon.com/512/3652/3652191.png"},
{price:10000,monthly:28000,img:"https://cdn-icons-png.flaticon.com/512/4257/4257483.png"},
{price:15000,monthly:42000,img:"https://cdn-icons-png.flaticon.com/512/4341/4341139.png"},
{price:20000,monthly:56000,img:"https://cdn-icons-png.flaticon.com/512/3081/3081559.png"},
{price:25000,monthly:70000,img:"https://cdn-icons-png.flaticon.com/512/3234/3234829.png"},
{price:30000,monthly:84000,img:"https://cdn-icons-png.flaticon.com/512/2748/2748558.png"},
{price:45000,monthly:126000,img:"https://cdn-icons-png.flaticon.com/512/2737/2737326.png"},
{price:75000,monthly:210000,img:"https://cdn-icons-png.flaticon.com/512/2829/2829810.png"},
{price:100000,monthly:280000,img:"https://cdn-icons-png.flaticon.com/512/3064/3064197.png"},
{price:150000,monthly:420000,img:"https://cdn-icons-png.flaticon.com/512/3081/3081582.png"},
{price:200000,monthly:560000,img:"https://cdn-icons-png.flaticon.com/512/2817/2817314.png"}

];

let tickerMessages=[
"Jean a déposé 10 000 FCFA",
"Fatou a retiré 5 000 FCFA",
"Kouadio a déposé 50 000 FCFA",
"Marie a retiré 20 000 FCFA",
"Samuel a déposé 15 000 FCFA"
];

function ticker(){
let html='<div id="ticker">';
tickerMessages.forEach(m=>{html+='<span>'+m+'</span>'});
html+='</div>';
return html;
}

function home(){

app.innerHTML=`

<h1>AfricaHash Mining Pro</h1>

<div class="hero">
<img src="https://images.unsplash.com/photo-1618477247222-acbdb0e159b3">
</div>

<button onclick="loginPage()">Connexion</button>
<button onclick="registerPage()">Inscription</button>

`;

}

function registerPage(){

app.innerHTML=`

<h2>Créer un compte</h2>

<input id="regUser" placeholder="Nom utilisateur">
<input id="regEmail" placeholder="Email">
<input id="regPass" placeholder="Mot de passe 6 chiffres">

<input id="refCode" placeholder="Code parrain (optionnel)">

<button onclick="register()">Créer</button>
<button onclick="home()">Retour</button>

`;

}

function register(){

let name=document.getElementById("regUser").value;
let email=document.getElementById("regEmail").value;
let pass=document.getElementById("regPass").value;
let ref=document.getElementById("refCode").value;

if(!/^\d{6}$/.test(pass)){
alert("Mot de passe = 6 chiffres");
return;
}

users[name]={password:pass,email:email};

localStorage.setItem("users",JSON.stringify(users));

if(ref!=""){
localStorage.setItem("ref",ref);
}

alert("Compte créé");

home();

}

function loginPage(){

app.innerHTML=`

<h2>Connexion</h2>

<input id="loginUser" placeholder="Nom utilisateur">
<input id="loginPass" placeholder="Mot de passe">

<button onclick="login()">Connexion</button>
<button onclick="home()">Retour</button>

`;

}

function login(){

let name=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

if(!users[name]||users[name].password!==pass){
alert("Erreur connexion");
return;
}

localStorage.setItem("user",name);

dashboard();

}

function dashboard(){

app.innerHTML=ticker()+`

<h2>Bienvenue ${user}</h2>

<p>Solde : <b id="bal">${balance.toFixed(0)}</b> FCFA</p>

<div class="notice">
Ton code parrain : <b>${user}</b>
</div>

<button onclick="machinesPage()">Machines</button>
<button onclick="deposit1()">Depot Wave</button>
<button onclick="withdrawPage()">Retrait</button>
<button onclick="historyPage()">Historique</button>
<button onclick="logout()">Déconnexion</button>

`;

startMining();

}

function machinesPage(){

let html=ticker()+`<h2>Machines de minage</h2><div id="machineList">`;

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

<b>Machine ${i+1}</b>

<p>${m.price} FCFA</p>

<p>${m.monthly} / mois</p>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`;

});

html+=`</div><button onclick="dashboard()">Retour</button>`;

app.innerHTML=html;

}

function buy(i){

let m=machines[i];

if(balance<m.price){
alert("Solde insuffisant");
return;
}

balance-=m.price;

ownedMachines.push({monthly:m.monthly,start:Date.now()});

localStorage.setItem("machines",JSON.stringify(ownedMachines));
localStorage.setItem("balance",balance);

alert("Machine activée");

dashboard();

}

function startMining(){

setInterval(()=>{

let gain=0;

ownedMachines.forEach(m=>{

gain+=m.monthly/(30*24*3600);

});

balance+=gain;

localStorage.setItem("balance",balance);

let bal=document.getElementById("bal");
if(bal)bal.innerText=balance.toFixed(0);

},1000);

}

function deposit1(){

app.innerHTML=ticker()+`

<h2>Dépôt Wave</h2>

<p>Numéro paiement :</p>
<h3>0173052512</h3>

<input id="amount" placeholder="Montant">

<button onclick="deposit2()">Suivant</button>

`;

}

function deposit2(){

let amount=document.getElementById("amount").value;

localStorage.setItem("depositAmount",amount);

app.innerHTML=ticker()+`

<h2>Confirmation paiement</h2>

<p>Montant : ${amount} FCFA</p>

<input id="waveId" placeholder="ID transaction">

<input type="file" id="waveProof">

<button onclick="confirmDeposit()">Confirmer</button>

`;

}

function confirmDeposit(){

let id=document.getElementById("waveId").value;

let proof=document.getElementById("waveProof").files.length;

if(id==""||proof==0){
alert("Ajoute ID et capture");
return;
}

let amount=parseFloat(localStorage.getItem("depositAmount"));

balance+=amount;

history.push({
type:"Depot",
amount:amount,
date:new Date().toLocaleString()
});

localStorage.setItem("history",JSON.stringify(history));
localStorage.setItem("balance",balance);

alert("Depot validé");

dashboard();

}

function withdrawPage(){

app.innerHTML=ticker()+`

<h2>Retrait</h2>

<input id="wAmount" placeholder="Montant">
<input id="wNumber" placeholder="Numero mobile money">

<button onclick="withdraw()">Valider</button>

`;

}

function withdraw(){

let amount=parseFloat(document.getElementById("wAmount").value);
let number=document.getElementById("wNumber").value;

if(amount>balance){
alert("Solde insuffisant");
return;
}

balance-=amount;

history.push({
type:"Retrait",
amount:amount,
number:number,
date:new Date().toLocaleString()
});

localStorage.setItem("history",JSON.stringify(history));
localStorage.setItem("balance",balance);

alert("Retrait enregistré");

dashboard();

}

function historyPage(){

let html=ticker()+`<h2>Historique</h2>`;

history.slice().reverse().forEach(h=>{

html+=`

<div class="machine">

<b>${h.type}</b>

<p>${h.amount} FCFA</p>

<p>${h.date}</p>

</div>

`;

});

html+=`<button onclick="dashboard()">Retour</button>`;

app.innerHTML=html;

}

function logout(){

localStorage.removeItem("user");

home();

}

if(user){dashboard()}else{home()}

</script>

</body>
</html>
