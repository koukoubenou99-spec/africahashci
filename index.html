<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfricaHash Mining Pro</title>
<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.container{
max-width:600px;
margin:auto;
padding:20px;
}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

input{
padding:10px;
border-radius:6px;
border:none;
margin:10px;
width:80%;
}

.machine{
background:#1e293b;
padding:15px;
margin:10px;
border-radius:10px;
}

.btn-wave{background:#1c7ed6;color:white}
</style>
</head>
<body>
<div id="app" class="container"></div>
<script>
let app=document.getElementById("app")
let user=localStorage.getItem("user")
let balance=parseFloat(localStorage.getItem("balance"))||0
let ownedMachines=JSON.parse(localStorage.getItem("machines"))||[]
let machines=[
{price:2500,monthly:7000},
{price:5000,monthly:14000},
{price:10000,monthly:28000},
{price:15000,monthly:42000},
{price:20000,monthly:56000},
{price:25000,monthly:70000},
{price:30000,monthly:84000},
{price:45000,monthly:126000},
{price:75000,monthly:210000},
{price:100000,monthly:280000},
{price:150000,monthly:420000},
{price:200000,monthly:560000}
]

function home(){
app.innerHTML=`
<h1>AfricaHash Mining Pro</h1>
<p>Simulation de minage crypto</p>
<button onclick="loginPage()">Connexion</button>
`
}

function loginPage(){
app.innerHTML=`
<h2>Connexion</h2>
<input id="username" placeholder="Nom utilisateur">
<br>
<button onclick="login()">Se connecter</button>
`
}

function login(){
let name=document.getElementById("username").value
if(name==""){
alert("Entrez un nom")
return
}
localStorage.setItem("user",name)
localStorage.setItem("balance",balance)
dashboard()
}

function dashboard(){
user=localStorage.getItem("user")
app.innerHTML=`
<h2>Bienvenue ${user}</h2>
<p>Solde: <b id="bal">${balance.toFixed(0)}</b> FCFA</p>
<button onclick="machinesPage()">Machines</button>
<br><br>
<button class="btn-wave" onclick="waveDepositStep1()">Depot Wave</button>
<br><br>
<button onclick="withdrawPage()">Retrait</button>
<br><br>
<button onclick="logout()">Deconnexion</button>
`
startMining()
}

function machinesPage(){
let html="<h2>Machines de Minage</h2>"
machines.forEach((m,i)=>{
html+=`
<div class="machine">
<h3>Machine ${i+1}</h3>
<p>Prix : ${m.price} FCFA</p>
<p>Gain : ${m.monthly} FCFA / mois</p>
<p>Durée : 2 mois</p>
<button onclick="buyMachine(${i})">Acheter</button>
</div>
`
})
html+=`<button onclick="dashboard()">Retour</button>`
app.innerHTML=html
}

function buyMachine(i){
let m=machines[i]
if(balance<m.price){
alert("Solde insuffisant")
return
}
balance-=m.price
let machine={
price:m.price,
monthly:m.monthly,
start:Date.now(),
duration:60
}
ownedMachines.push(machine)
localStorage.setItem("machines",JSON.stringify(ownedMachines))
localStorage.setItem("balance",balance)
alert("Machine activée ! Elle commence à miner.")
dashboard()
}

function startMining(){
setInterval(()=>{
let now=Date.now()
let gain=0
ownedMachines.forEach(machine=>{
let seconds=(now-machine.start)/1000
let totalSeconds=machine.duration*30*24*3600
if(seconds<totalSeconds){
let perSecond=(machine.monthly/(30*24*3600))
gain+=perSecond
}
})
balance+=gain
let bal=document.getElementById("bal")
if(bal){
bal.innerText=balance.toFixed(0)
}
localStorage.setItem("balance",balance)
},1000)
}

// --- Dépôt Wave en 2 étapes ---
function waveDepositStep1(){
app.innerHTML=`
<h2>Dépôt Wave</h2>
<p>Numéro pour recharger : <strong>0173052512</strong></p>
<input id="depositAmount" type="number" placeholder="Montant à déposer">
<br>
<button class="btn-wave" onclick="waveDepositStep2()">Suivant</button>
<br><br>
<button onclick="dashboard()">Retour</button>
`
}

function waveDepositStep2(){
let amount=parseFloat(document.getElementById("depositAmount").value)
if(isNaN(amount)||amount<=0){
alert("Montant invalide")
return
}
localStorage.setItem("pendingAmount", amount)
app.innerHTML=`
<h2>Confirmation du paiement Wave</h2>
<p>Montant : ${amount} FCFA</p>
<p>Numéro : <strong>0173052512</strong></p>
<input id="waveId" placeholder="ID de transaction Wave">
<br>
<input type="file" id="waveReceipt" accept="image/*">
<br>
<button class="btn-wave" onclick="finalizeWaveDeposit()">Confirmer</button>
<br><br>
<button onclick="dashboard()">Retour</button>
`
}

function finalizeWaveDeposit(){
let id=document.getElementById("waveId").value
let receipt=document.getElementById("waveReceipt").files.length
if(id=="" || receipt==0){
alert("Veuillez ajouter ID et capture du paiement")
return
}
let amount=parseFloat(localStorage.getItem("pendingAmount"))
balance+=amount
localStorage.setItem("balance",balance)
localStorage.removeItem("pendingAmount")
alert(`Dépôt Wave de ${amount} FCFA confirmé !`)
dashboard()
}

function withdrawPage(){
app.innerHTML=`
<h2>Retrait</h2>
<input id="withdraw" placeholder="Montant">
<br>
<button onclick="withdraw()">Valider</button>
<br>
<button onclick="dashboard()">Retour</button>
`
}

function withdraw(){
let amount=parseFloat(document.getElementById("withdraw").value)
if(amount>balance){
alert("Solde insuffisant")
return
}
balance-=amount
localStorage.setItem("balance",balance)
alert("Retrait effectué")
dashboard()
}

function logout(){
localStorage.clear()
home()
}

if(user){
dashboard()
}else{
home()
}
</script>
</body>
</html>
