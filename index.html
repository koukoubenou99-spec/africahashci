<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Africa Mining</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{

margin:0;
background-image:url("https://i.imgur.com/0Z8FQ7Q.png");
background-size:200px;
background-repeat:repeat;

}

.container{

max-width:420px;
margin:auto;
min-height:100vh;
background:white;
padding:20px;

}

.header{

text-align:center;
margin-bottom:20px;

}

.hero img{

width:100%;
border-radius:10px;

}

.row{

display:flex;
gap:8px;
margin-top:10px;

}

input{

flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ccc;

}

button{

padding:12px;
border:none;
border-radius:8px;
background:gold;
font-weight:bold;
cursor:pointer;

}

.full{

width:100%;
margin-top:10px;

}

.green{

background:#2ecc71;
color:white;

}

.card{

background:#fafafa;
padding:15px;
border-radius:10px;
margin-top:10px;

}

.machine{

display:flex;
gap:10px;
background:#fff8dc;
padding:10px;
border-radius:10px;
margin-top:10px;
align-items:center;

}

.machine img{

width:60px;

}

.small{

font-size:12px;
color:#666;

}

</style>

</head>

<body>

<div id="app" class="container"></div>

<script>

const app=document.getElementById("app")

let users=JSON.parse(localStorage.getItem("users"))||{}
let deposits=JSON.parse(localStorage.getItem("deposits"))||[]

let current=null

function save(){

localStorage.setItem("users",JSON.stringify(users))
localStorage.setItem("deposits",JSON.stringify(deposits))

}

/* code affiliation */

function generateCode(){

return "AF"+Math.floor(Math.random()*100000)

}

/* accueil */

function home(){

app.innerHTML=`

<div class="header">

<h1>Africa Mining</h1>

</div>

<div class="hero">

<img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Bitcoin_mining_hardware.jpg">

</div>

<div class="row">

<input id="phone" placeholder="Numéro téléphone">

<input id="pin" type="password" maxlength="4" placeholder="PIN">

<button onclick="login()">Connexion</button>

</div>

<button class="full" onclick="registerPage()">S'inscrire</button>

`

}

/* inscription */

function registerPage(){

app.innerHTML=`

<h2>Créer un compte</h2>

<input id="phone" placeholder="Numéro téléphone">

<input id="pin" type="password" maxlength="4" placeholder="PIN 4 chiffres">

<input id="ref" placeholder="Code parrain (facultatif)">

<button class="full" onclick="register()">Créer compte</button>

<button class="full" onclick="home()">Retour</button>

`

}

function register(){

let phone=document.getElementById("phone").value
let pin=document.getElementById("pin").value
let ref=document.getElementById("ref").value

if(pin.length!=4){

alert("PIN = 4 chiffres")
return

}

if(users[phone]){

alert("Compte existe déjà")
return

}

let code=generateCode()

users[phone]={

pin:pin,
balance:0,
machines:[],
refCode:code,
referrer:ref,
firstDeposit:false

}

save()

alert("Compte créé")

home()

}

/* connexion */

function login(){

let phone=document.getElementById("phone").value
let pin=document.getElementById("pin").value

if(!users[phone]||users[phone].pin!=pin){

alert("Connexion incorrecte")
return

}

current=phone

dashboard()

}

/* dashboard */

function dashboard(){

let u=users[current]

app.innerHTML=`

<h2>Tableau de bord</h2>

<div class="card">

Compte : ${current}<br>
Solde : <b>${u.balance} FCFA</b>

</div>

<div class="card">

Code parrain : <b>${u.refCode}</b>

</div>

<button class="full" onclick="affiliatePage()">Lien d'affiliation</button>

<button class="full" onclick="machinePage()">Machines</button>

<button class="full" onclick="depositPage()">Faire dépôt</button>

<button class="full green" onclick="transactions()">Transactions</button>

<button class="full" onclick="admin()">Admin</button>

<button class="full" onclick="logout()">Déconnexion</button>

`

}

/* page affiliation */

function affiliatePage(){

let code=users[current].refCode

let link=location.href+"?ref="+code

app.innerHTML=`

<h2>Affiliation</h2>

<div class="card">

Ton lien :

<br><br>

<input value="${link}" id="link">

</div>

<button class="full" onclick="copyLink()">Copier lien</button>

<button class="full" onclick="dashboard()">Retour</button>

`

}

function copyLink(){

let link=document.getElementById("link")

link.select()

document.execCommand("copy")

alert("Lien copié")

}

/* machines */

let machines=[

{name:"Ethereum Starter",price:2500,gain:250,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},

{name:"Bitcoin Basic",price:5000,gain:600,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"Litecoin Miner",price:10000,gain:1400,img:"https://cryptologos.cc/logos/litecoin-ltc-logo.png"},

{name:"Dogecoin Rig",price:20000,gain:3000,img:"https://cryptologos.cc/logos/dogecoin-doge-logo.png"},

{name:"Solana Node",price:50000,gain:8000,img:"https://cryptologos.cc/logos/solana-sol-logo.png"},

{name:"Ethereum Pro",price:100000,gain:17000,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},

{name:"Bitcoin Farm",price:200000,gain:35000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"XRP Mega Farm",price:300000,gain:55000,img:"https://cryptologos.cc/logos/xrp-xrp-logo.png"}

]

function machinePage(){

let html="<h2>Machines</h2>"

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

<b>${m.name}</b><br>

Prix : ${m.price} FCFA<br>

Gain journalier : ${m.gain}

<br>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`

})

html+=`<button class="full" onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* achat */

function buy(i){

let u=users[current]
let m=machines[i]

if(u.balance<m.price){

alert("Solde insuffisant")
return

}

u.balance-=m.price
u.machines.push(m)

save()

alert("Machine activée")

dashboard()

}

/* dépôt */

function depositPage(){

app.innerHTML=`

<h2>Dépôt</h2>

<div class="card">

Procédure :

<br><br>

1️⃣ Envoyer via Wave au numéro

<br>

<b>0173052512</b>

<br><br>

2️⃣ Copier l'ID de transaction

<br>

3️⃣ Ajouter capture écran

<br>

4️⃣ Cliquer sur envoyer

</div>

<input id="amount" placeholder="Montant">

<input id="tx" placeholder="ID transaction">

<input type="file">

<button class="full" onclick="sendDeposit()">Envoyer</button>

<button class="full" onclick="dashboard()">Retour</button>

`

}

function sendDeposit(){

let amount=parseInt(document.getElementById("amount").value)
let tx=document.getElementById("tx").value

deposits.push({

user:current,
amount:amount,
tx:tx,
status:"en attente"

})

save()

alert("Dépôt envoyé")

dashboard()

}

/* transactions */

function transactions(){

let html="<h2>Transactions</h2>"

deposits.forEach(d=>{

if(d.user==current){

html+=`

<div class="card">

Montant : ${d.amount}<br>
TX : ${d.tx}<br>
Statut : ${d.status}

</div>

`

}

})

html+=`<button class="full" onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* admin */

function admin(){

let html="<h2>Dépôts</h2>"

deposits.forEach((d,i)=>{

html+=`

<div class="card">

Utilisateur : ${d.user}<br>
Montant : ${d.amount}

<br><br>

<button onclick="validate(${i})">Valider</button>

<button onclick="reject(${i})">Refuser</button>

</div>

`

})

html+=`<button class="full" onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

function validate(i){

let d=deposits[i]

users[d.user].balance+=d.amount

d.status="validé"

/* affiliation */

if(!users[d.user].firstDeposit){

let ref=users[d.user].referrer

for(let u in users){

if(users[u].refCode==ref){

users[u].balance+=d.amount*0.10

}

}

users[d.user].firstDeposit=true

}

save()

}

function reject(i){

deposits[i].status="refusé"

save()

}

function logout(){

current=null
home()

}

home()

</script>

</body>
</html>
