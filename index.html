<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Africa Mining</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
margin:0;
background:#fff9cc;
overflow:hidden;
}

/* animation oeufs */

.egg{
position:fixed;
top:-40px;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-50px)}
100%{transform:translateY(110vh)}
}

/* poussin */

.chick{
position:fixed;
bottom:10px;
right:10px;
font-size:70px;
}

/* app */

.container{

position:relative;
z-index:2;

max-width:420px;
margin:auto;
height:100vh;
background:white;

display:flex;
flex-direction:column;

padding:15px;

}

/* accueil */

.hero img{

width:100%;
border-radius:10px;
margin-bottom:10px;

}

h2{
text-align:center;
margin:5px 0;
}

/* inputs */

input{

width:100%;
padding:11px;
margin-top:8px;

border-radius:8px;
border:1px solid #ccc;

}

/* boutons */

button{

width:100%;
padding:12px;

margin-top:10px;

border:none;
border-radius:10px;

background:gold;
font-weight:bold;

}

/* cartes */

.card{

background:#fff7cc;
padding:12px;
border-radius:10px;
margin-top:10px;

}

/* machines */

.machine{

display:flex;
gap:10px;

background:#fff7cc;
padding:10px;

border-radius:10px;
margin:8px 0;

align-items:center;

}

.machine img{

width:55px;
height:55px;

}

/* scroll machines */

#machines{

overflow-y:auto;
flex:1;

}

.small{

font-size:12px;
color:#777;

}

</style>

</head>

<body>

<div class="chick">🐥</div>

<div id="app" class="container"></div>

<script>

/* animation oeufs */

for(let i=0;i<25;i++){

let egg=document.createElement("div")

egg.className="egg"
egg.innerText="🥚"

egg.style.left=Math.random()*100+"%"
egg.style.animationDuration=(5+Math.random()*10)+"s"

document.body.appendChild(egg)

}

/* stockage local */

let users=JSON.parse(localStorage.getItem("users"))||{}
let deposits=JSON.parse(localStorage.getItem("deposits"))||[]

let current=null

function save(){

localStorage.setItem("users",JSON.stringify(users))
localStorage.setItem("deposits",JSON.stringify(deposits))

}

/* machines */

let machines=[

{name:"ASIC BTC S1",price:2500,gain:250,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S2",price:5000,gain:600,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S3",price:10000,gain:1300,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S4",price:20000,gain:2800,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S5",price:50000,gain:7200,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S6",price:100000,gain:15000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S7",price:200000,gain:32000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},

{name:"ASIC BTC S8",price:300000,gain:50000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"}

]

/* accueil */

function home(){

app.innerHTML=`

<div class="hero">

<img src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Bitcoin_mining_hardware.jpg">

</div>

<h2>Africa Mining</h2>

<input id="user" placeholder="Nom utilisateur">

<input id="pass" type="password" placeholder="Mot de passe 6 chiffres">

<button onclick="login()">Connexion</button>

<button onclick="register()">Créer compte</button>

`

}

/* inscription */

function register(){

let u=user.value
let p=pass.value

if(p.length!=6){

alert("Mot de passe = 6 chiffres")
return

}

if(users[u]){

alert("Utilisateur existe déjà")
return

}

users[u]={

pass:p,
balance:0,
machines:[]

}

save()

alert("Compte créé")

}

/* connexion */

function login(){

let u=user.value
let p=pass.value

if(!users[u]||users[u].pass!=p){

alert("Connexion incorrecte")
return

}

current=u

dashboard()

}

/* dashboard */

function dashboard(){

let u=users[current]

app.innerHTML=`

<h2>Bienvenue ${current}</h2>

<div class="card">

Solde : <b>${u.balance} FCFA</b>

</div>

<button onclick="machinePage()">Machines de minage</button>

<button onclick="depositPage()">Faire un dépôt</button>

<button onclick="admin()">Admin</button>

<button onclick="logout()">Déconnexion</button>

`

}

/* machines */

function machinePage(){

let html=`<h2>Machines de minage</h2><div id="machines">`

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

<b>${m.name}</b><br>

Prix : ${m.price} FCFA<br>

Gain journalier : ${m.gain} FCFA

<br>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`

})

html+=`</div>

<button onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* achat */

function buy(i){

let u=users[current]
let m=machines[i]

if(u.balance<m.price){

alert("Solde insuffisant")
return

}

u.balance-=m.price

u.machines.push(m)

save()

alert("Machine activée")

dashboard()

}

/* dépôt */

function depositPage(){

app.innerHTML=`

<h2>Dépôt</h2>

<div class="card">

Envoyer sur :<br>

<b>Wave : 0173052512</b>

</div>

<input id="amount" placeholder="Montant">

<input id="tx" placeholder="ID transaction">

<p class="small">Ajouter capture écran paiement</p>

<input type="file">

<button onclick="sendDeposit()">Envoyer</button>

<button onclick="dashboard()">Retour</button>

`

}

/* envoyer dépôt */

function sendDeposit(){

deposits.push({

user:current,
amount:amount.value,
tx:tx.value

})

save()

alert("Dépôt envoyé pour validation")

dashboard()

}

/* admin */

function admin(){

let html="<h2>Dépôts en attente</h2>"

deposits.forEach((d,i)=>{

html+=`

<div class="card">

Utilisateur : ${d.user}<br>

Montant : ${d.amount}<br>

TX : ${d.tx}

<br>

<button onclick="validate(${i})">Valider</button>

<button onclick="reject(${i})">Refuser</button>

</div>

`

})

html+=`<button onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* valider */

function validate(i){

let d=deposits[i]

users[d.user].balance+=parseInt(d.amount)

deposits.splice(i,1)

save()

admin()

}

/* refuser */

function reject(i){

deposits.splice(i,1)

save()

admin()

}

/* logout */

function logout(){

current=null
home()

}

home()

</script>

</body>
</html>
