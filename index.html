<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Africa Mining</title>

<style>

body{
margin:0;
font-family:Arial;
background:#fffbe6;
overflow:hidden;
}

/* animation oeufs */

.egg{
position:fixed;
top:-50px;
font-size:25px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-50px)}
100%{transform:translateY(100vh)}
}

/* poussin */

.chick{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
font-size:80px;
}

/* app */

.container{

position:relative;
z-index:10;

max-width:420px;
margin:auto;
height:100vh;
background:white;
padding:15px;
display:flex;
flex-direction:column;
overflow:hidden;

}

h2{
text-align:center;
}

button{

padding:12px;
margin:6px 0;
border:none;
border-radius:8px;
background:gold;
font-weight:bold;

}

input{

padding:10px;
margin:5px 0;
border-radius:6px;
border:1px solid #ccc;

}

.machine{

display:flex;
gap:10px;
background:#fff7cc;
padding:10px;
margin:8px 0;
border-radius:8px;

}

.machine img{
width:55px;
height:55px;
}

#machineList{

overflow-y:auto;
height:320px;

}

.small{
font-size:13px;
color:#666;
}

</style>

</head>

<body>

<div id="eggs"></div>

<div class="chick">🐥</div>

<div class="container" id="app"></div>

<script>

/* animation oeufs */

for(let i=0;i<20;i++){

let e=document.createElement("div")

e.className="egg"

e.innerText="🥚"

e.style.left=Math.random()*100+"%"

e.style.animationDuration=(5+Math.random()*10)+"s"

document.body.appendChild(e)

}

/* base */

let app=document.getElementById("app")

let users={}

let currentUser=null

let pendingDeposits=[]

/* machines */

let machines=[

{price:2500,monthly:7000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},
{price:5000,monthly:14000,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},
{price:10000,monthly:28000,img:"https://cryptologos.cc/logos/tether-usdt-logo.png"},
{price:20000,monthly:56000,img:"https://cryptologos.cc/logos/binance-coin-bnb-logo.png"},
{price:50000,monthly:150000,img:"https://cryptologos.cc/logos/solana-sol-logo.png"},
{price:100000,monthly:300000,img:"https://cryptologos.cc/logos/xrp-xrp-logo.png"}

]

/* accueil */

function home(){

app.innerHTML=`

<h2>Africa Mining</h2>

<input id="user" placeholder="Nom utilisateur">

<input id="pass" type="password" placeholder="Mot de passe 6 chiffres">

<button onclick="login()">Connexion</button>

<button onclick="register()">Créer compte</button>

`

}

/* inscription */

function register(){

let u=document.getElementById("user").value

let p=document.getElementById("pass").value

if(p.length!=6){

alert("mot de passe = 6 chiffres")
return

}

users[u]={

pass:p,
balance:0,
machines:[]

}

alert("compte créé")

}

/* connexion */

function login(){

let u=document.getElementById("user").value

let p=document.getElementById("pass").value

if(!users[u]){

alert("compte introuvable")
return

}

if(users[u].pass!=p){

alert("mot de passe incorrect")
return

}

currentUser=u

dashboard()

}

/* dashboard */

function dashboard(){

let u=users[currentUser]

app.innerHTML=`

<h2>Bienvenue ${currentUser}</h2>

<h3>Solde : ${u.balance} FCFA</h3>

<button onclick="machinesPage()">Machines</button>

<button onclick="depositPage()">Dépôt</button>

<button onclick="admin()">Admin</button>

<button onclick="logout()">Déconnexion</button>

`

}

/* machines */

function machinesPage(){

let html=`

<h2>Machines</h2>

<div id="machineList">

`

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

Prix : ${m.price} FCFA<br>

Gain : ${m.monthly}/mois

<br>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`

})

html+=`</div>

<button onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* achat */

function buy(i){

let u=users[currentUser]

let m=machines[i]

if(u.balance<m.price){

alert("solde insuffisant")
return

}

u.balance-=m.price

u.machines.push(m)

alert("machine activée")

dashboard()

}

/* page depot */

function depositPage(){

app.innerHTML=`

<h2>Dépôt</h2>

<p>Envoyer sur ce numéro :</p>

<h3>Wave : 0173052512</h3>

<input id="amount" placeholder="Montant">

<input id="txid" placeholder="ID Transaction">

<input type="file" id="proof">

<p class="small">ajouter capture écran du paiement</p>

<button onclick="sendDeposit()">Envoyer la demande</button>

<button onclick="dashboard()">Retour</button>

`

}

/* envoyer depot */

function sendDeposit(){

let amount=document.getElementById("amount").value

let tx=document.getElementById("txid").value

pendingDeposits.push({

user:currentUser,
amount:amount,
tx:tx

})

alert("dépôt envoyé pour vérification")

dashboard()

}

/* admin */

function admin(){

let html="<h2>Dépôts en attente</h2>"

pendingDeposits.forEach((d,i)=>{

html+=`

<div class="machine">

Utilisateur : ${d.user}<br>

Montant : ${d.amount}<br>

TX : ${d.tx}

<br>

<button onclick="validate(${i})">Valider</button>

<button onclick="reject(${i})">Refuser</button>

</div>

`

})

html+=`<button onclick="dashboard()">Retour</button>`

app.innerHTML=html

}

/* validation */

function validate(i){

let d=pendingDeposits[i]

users[d.user].balance+=parseInt(d.amount)

pendingDeposits.splice(i,1)

alert("dépôt validé")

admin()

}

function reject(i){

pendingDeposits.splice(i,1)

admin()

}

/* logout */

function logout(){

currentUser=null

home()

}

home()

</script>

</body>

</html>
