<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AfricaHash Mining</title>

<style>

body{
margin:0;
font-family:Arial;
background:#fff9cc;
overflow:hidden;
}

/* oeufs */

.egg{
position:fixed;
top:-50px;
font-size:22px;
animation:fall linear infinite;
}

@keyframes fall{
0%{transform:translateY(-50px)}
100%{transform:translateY(110vh)}
}

/* poussin */

.chick{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
font-size:70px;
}

/* app */

.container{
position:relative;
z-index:10;
max-width:420px;
margin:auto;
height:100vh;
background:white;
padding:15px;
display:flex;
flex-direction:column;
overflow:hidden;
border-radius:12px;
}

h2{text-align:center}

input{
padding:12px;
margin:6px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:gold;
font-weight:bold;
}

.machine{
display:flex;
gap:12px;
background:#fff3b0;
padding:10px;
border-radius:10px;
margin:8px 0;
}

.machine img{
width:55px;
height:55px;
}

#machineList{
overflow-y:auto;
height:350px;
}

.small{
font-size:12px;
color:#666;
}

</style>
</head>

<body>

<div class="chick">🐥</div>
<div id="app" class="container"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getFirestore,collection,addDoc,getDocs,doc,updateDoc } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js";
import { getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getStorage,ref,uploadBytes } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-storage.js";

/* firebase */

const firebaseConfig = {

apiKey: "AIzaSyBjVlVd_sVyTqHh16hL99eHvlzDqxNIMiE",
authDomain: "africahash-ci.firebaseapp.com",
projectId: "africahash-ci",
storageBucket: "africahash-ci.firebasestorage.app",
messagingSenderId: "736855761000",
appId: "1:736855761000:web:5f7a6e51514512e05a1bdd",
measurementId: "G-2WJZZ669LR"

};

const appFirebase = initializeApp(firebaseConfig);

const db=getFirestore(appFirebase)
const auth=getAuth(appFirebase)
const storage=getStorage(appFirebase)

let app=document.getElementById("app")

let currentUser=null

/* machines */

let machines=[

{price:2500,gain:7000,img:"https://cryptologos.cc/logos/bitcoin-btc-logo.png"},
{price:5000,gain:14000,img:"https://cryptologos.cc/logos/ethereum-eth-logo.png"},
{price:10000,gain:28000,img:"https://cryptologos.cc/logos/tether-usdt-logo.png"},
{price:20000,gain:56000,img:"https://cryptologos.cc/logos/binance-coin-bnb-logo.png"},
{price:50000,gain:150000,img:"https://cryptologos.cc/logos/solana-sol-logo.png"},
{price:100000,gain:300000,img:"https://cryptologos.cc/logos/xrp-xrp-logo.png"}

]

/* accueil */

function home(){

app.innerHTML=`

<h2>AfricaHash Mining</h2>

<input id="email" placeholder="Email">

<input id="pass" type="password" placeholder="Mot de passe">

<button onclick="register()">Créer compte</button>

<button onclick="login()">Connexion</button>

`

}

window.home=home

/* inscription */

window.register=async function(){

let email=document.getElementById("email").value
let pass=document.getElementById("pass").value

await createUserWithEmailAndPassword(auth,email,pass)

alert("compte créé")

}

/* connexion */

window.login=async function(){

let email=document.getElementById("email").value
let pass=document.getElementById("pass").value

let res=await signInWithEmailAndPassword(auth,email,pass)

currentUser=res.user.uid

dashboard()

}

/* dashboard */

async function dashboard(){

app.innerHTML=`

<h2>Dashboard</h2>

<button onclick="machinesPage()">Machines</button>

<button onclick="depositPage()">Dépôt</button>

<button onclick="admin()">Admin</button>

`

}

window.dashboard=dashboard

/* machines */

window.machinesPage=function(){

let html="<h2>Machines</h2><div id='machineList'>"

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

Prix : ${m.price} FCFA<br>

Gain : ${m.gain}/mois<br>

<button onclick="buy(${i})">Acheter</button>

</div>

</div>

`

})

html+="</div><button onclick='dashboard()'>Retour</button>"

app.innerHTML=html

}

/* achat */

window.buy=async function(i){

let m=machines[i]

await addDoc(collection(db,"machines"),{

user:currentUser,
price:m.price,
gain:m.gain

})

alert("machine activée")

}

/* depot */

window.depositPage=function(){

app.innerHTML=`

<h2>Dépôt</h2>

<p>Envoyer sur :</p>

<h3>Wave : 0173052512</h3>

<input id="amount" placeholder="Montant">

<input id="txid" placeholder="ID transaction">

<input type="file" id="proof">

<button onclick="sendDeposit()">Envoyer</button>

<button onclick="dashboard()">Retour</button>

`

}

/* envoyer depot */

window.sendDeposit=async function(){

let amount=document.getElementById("amount").value
let tx=document.getElementById("txid").value
let file=document.getElementById("proof").files[0]

let storageRef=ref(storage,"proofs/"+Date.now())

await uploadBytes(storageRef,file)

await addDoc(collection(db,"deposits"),{

user:currentUser,
amount:amount,
tx:tx,
status:"pending"

})

alert("dépôt envoyé")

dashboard()

}

/* admin */

window.admin=async function(){

let html="<h2>Dépôts</h2>"

let q=await getDocs(collection(db,"deposits"))

q.forEach((docu)=>{

let d=docu.data()

if(d.status=="pending"){

html+=`

<div class="machine">

${d.user}<br>

${d.amount} FCFA<br>

${d.tx}

<br>

<button onclick="validate('${docu.id}','${d.amount}','${d.user}')">Valider</button>

</div>

`

}

})

html+="<button onclick='dashboard()'>Retour</button>"

app.innerHTML=html

}

/* validation */

window.validate=async function(id,amount,user){

await updateDoc(doc(db,"deposits",id),{

status:"done"

})

await addDoc(collection(db,"balances"),{

user:user,
amount:amount

})

alert("dépôt validé")

admin()

}

home()

</script>

</body>
</html>
