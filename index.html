<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AfricaHash Mining Pro</title>

<style>

body{
margin:0;
font-family:Arial;
background:white;
color:#333;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

.container{
max-width:650px;
height:90vh;
margin:auto;
padding:20px;
background:white;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
display:flex;
flex-direction:column;
text-align:center;
}

button{
padding:12px 20px;
margin:6px;
border:none;
border-radius:8px;
background:gold;
font-weight:bold;
cursor:pointer;
}

input{
padding:10px;
margin:8px;
border-radius:6px;
border:1px solid #ccc;
width:85%;
}

.machine{
background:#fff9db;
padding:10px;
margin:10px;
border-radius:10px;
display:flex;
align-items:center;
gap:10px;
}

.machine img{
width:60px;
height:60px;
}

#machineList{
overflow-y:auto;
height:400px;
}

#ticker{
background:#fff3c4;
padding:10px;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
white-space:nowrap;
}

#ticker span{
display:inline-block;
padding-right:50px;
animation:ticker 15s linear infinite;
color:goldenrod;
font-weight:bold;
}

@keyframes ticker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

</style>
</head>

<body>

<div class="container" id="app"></div>

<script>

let app=document.getElementById("app");

let users=JSON.parse(localStorage.getItem("users"))||{};
let user=localStorage.getItem("user");
let balance=parseFloat(localStorage.getItem("balance"))||0;

let ownedMachines=JSON.parse(localStorage.getItem("machines"))||[];

let history=JSON.parse(localStorage.getItem("history"))||[];

let machines=[

{price:2500,monthly:7000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135715.png"},
{price:5000,monthly:14000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828919.png"},
{price:10000,monthly:28000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135706.png"},
{price:15000,monthly:42000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828884.png"},
{price:20000,monthly:56000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135699.png"},
{price:25000,monthly:70000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828911.png"},
{price:30000,monthly:84000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135712.png"},
{price:45000,monthly:126000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828888.png"},
{price:75000,monthly:210000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135690.png"},
{price:100000,monthly:280000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828915.png"},
{price:150000,monthly:420000,img:"https://cdn-icons-png.flaticon.com/512/3135/3135696.png"},
{price:200000,monthly:560000,img:"https://cdn-icons-png.flaticon.com/512/1828/1828921.png"}

];

let tickerMessages=[
"Jean a déposé 10 000 FCFA",
"Fatou a retiré 5 000 FCFA",
"Kouadio a déposé 50 000 FCFA",
"Marie a retiré 20 000 FCFA",
"Samuel a déposé 15 000 FCFA"
];

function renderTicker(){

let html='<div id="ticker">';

tickerMessages.forEach(m=>{
html+='<span>'+m+'</span>';
});

html+='</div>';

return html;

}

function home(){

app.innerHTML=`

<h1>AfricaHash Mining Pro</h1>

<button onclick="loginPage()">Connexion</button>

<button onclick="registerPage()">Inscription</button>

`;

}

function registerPage(){

app.innerHTML=`

<h2>Inscription</h2>

<input id="regUser" placeholder="Nom utilisateur">

<input id="regEmail" placeholder="Email">

<input id="regPass" type="password" placeholder="Mot de passe 6 chiffres">

<button onclick="register()">S'inscrire</button>

<button onclick="home()">Retour</button>

`;

}

function register(){

let name=document.getElementById("regUser").value;
let email=document.getElementById("regEmail").value;
let pass=document.getElementById("regPass").value;

if(!/^\d{6}$/.test(pass)){
alert("Mot de passe = 6 chiffres");
return;
}

users[name]={password:pass,email:email};

localStorage.setItem("users",JSON.stringify(users));

alert("Compte créé");

home();

}

function loginPage(){

app.innerHTML=`

<h2>Connexion</h2>

<input id="loginUser" placeholder="Nom utilisateur">

<input id="loginPass" type="password" placeholder="Mot de passe">

<button onclick="login()">Connexion</button>

<button onclick="home()">Retour</button>

`;

}

function login(){

let name=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

if(!users[name]||users[name].password!==pass){
alert("Erreur connexion");
return;
}

localStorage.setItem("user",name);

dashboard();

}

function dashboard(){

user=localStorage.getItem("user");

app.innerHTML=renderTicker()+`

<h2>Bienvenue ${user}</h2>

<p>Solde : <b id="bal">${balance.toFixed(0)}</b> FCFA</p>

<button onclick="machinesPage()">Machines de minage</button>

<button onclick="depositPage()">Depot Wave</button>

<button onclick="withdrawPage()">Retrait</button>

<button onclick="historyPage()">Historique</button>

<button onclick="logout()">Déconnexion</button>

`;

startMining();

}

function machinesPage(){

let html=renderTicker()+`<h2>Machines de Minage</h2><div id="machineList">`;

machines.forEach((m,i)=>{

html+=`

<div class="machine">

<img src="${m.img}">

<div>

<h3>Machine ${i+1}</h3>

<p>Prix : ${m.price} FCFA</p>

<p>Gain : ${m.monthly} / mois</p>

<button onclick="buyMachine(${i})">Acheter</button>

</div>

</div>

`;

});

html+=`</div><button onclick="dashboard()">Retour</button>`;

app.innerHTML=html;

}

function buyMachine(i){

let m=machines[i];

if(balance<m.price){
alert("Solde insuffisant");
return;
}

balance-=m.price;

ownedMachines.push({price:m.price,monthly:m.monthly,start:Date.now()});

localStorage.setItem("machines",JSON.stringify(ownedMachines));

localStorage.setItem("balance",balance);

alert("Machine activée");

dashboard();

}

function startMining(){

setInterval(()=>{

let gain=0;

ownedMachines.forEach(m=>{

gain+=m.monthly/(30*24*3600);

});

balance+=gain;

localStorage.setItem("balance",balance);

let bal=document.getElementById("bal");

if(bal)bal.innerText=balance.toFixed(0);

},1000);

}

function depositPage(){

app.innerHTML=renderTicker()+`

<h2>Depot Wave</h2>

<p>Numéro : <b>0173052512</b></p>

<input id="amount" type="number" placeholder="Montant">

<button onclick="deposit()">Confirmer</button>

<button onclick="dashboard()">Retour</button>

`;

}

function deposit(){

let amount=parseFloat(document.getElementById("amount").value);

balance+=amount;

history.push({
type:"Depot",
amount:amount,
number:"Wave",
date:new Date().toLocaleString()
});

localStorage.setItem("history",JSON.stringify(history));

localStorage.setItem("balance",balance);

alert("Depot confirmé");

dashboard();

}

function withdrawPage(){

app.innerHTML=renderTicker()+`

<h2>Retrait</h2>

<input id="withdrawAmount" type="number" placeholder="Montant">

<input id="withdrawNumber" placeholder="Numéro Mobile Money">

<button onclick="withdraw()">Valider</button>

<button onclick="dashboard()">Retour</button>

`;

}

function withdraw(){

let amount=parseFloat(document.getElementById("withdrawAmount").value);

let number=document.getElementById("withdrawNumber").value;

if(amount>balance){
alert("Solde insuffisant");
return;
}

balance-=amount;

history.push({
type:"Retrait",
amount:amount,
number:number,
date:new Date().toLocaleString()
});

localStorage.setItem("history",JSON.stringify(history));

localStorage.setItem("balance",balance);

alert("Retrait effectué");

dashboard();

}

function historyPage(){

let html=renderTicker()+`<h2>Historique</h2>`;

history.reverse().forEach(h=>{

html+=`

<div class="machine">

<p><b>${h.type}</b> - ${h.amount} FCFA</p>

<p>${h.number}</p>

<p>${h.date}</p>

</div>

`;

});

html+=`<button onclick="dashboard()">Retour</button>`;

app.innerHTML=html;

}

function logout(){

localStorage.removeItem("user");

home();

}

if(user){dashboard()}else{home()}

</script>

</body>
</html>
